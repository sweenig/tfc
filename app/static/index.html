<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Troop Planner">
  <title>Scout Meeting Planner</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:        #002868;
      --navy-light:  #1a3f80;
      --red:         #BF0A30;
      --green:       #1f6e3c;
      --green-light: #e6f4ec;
      --amber:       #d97706;
      --amber-light: #fef3c7;
      --surface:     #ffffff;
      --bg:          #f1f3f6;
      --border:      #dde1e7;
      --text:        #111827;
      --muted:       #6b7280;
      --shadow:      0 2px 10px rgba(0,0,0,.10);
      --radius:      12px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
    }

    /* ── Header ─────────────────────────────────────────────────────── */
    header {
      background: var(--navy);
      color: #fff;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow);
    }
    header h1 { font-size: 1.15rem; font-weight: 700; }

    /* ── Content ─────────────────────────────────────────────────────── */
    .content {
      padding: 16px;
      max-width: 960px;
      margin: 0 auto;
    }

    /* ── Cards ──────────────────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
    }
    .card-title {
      font-size: .8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--muted);
      margin-bottom: 10px;
    }

    /* ── Alert banners ───────────────────────────────────────────────── */
    .alert {
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 12px;
      font-size: .88rem;
    }
    .alert-ok  { background: var(--green-light); color: #14532d; }
    .alert-err { background: #fff0f0; color: #991b1b; }
    .alert-inf { background: #eff6ff; color: #1e40af; }

    /* ── Present chips ───────────────────────────────────────────────── */
    .present-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 2px; }

    .chip {
      display: inline-flex;
      align-items: center;
      background: var(--green-light);
      color: var(--green);
      border-radius: 100px;
      padding: 4px 10px;
      font-size: .78rem;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      transition: background .15s, color .15s;
    }
    .chip:hover { opacity: .8; }
    .chip.absent {
      background: #fff0f0;
      color: var(--red);
    }

    /* ── Requirements ────────────────────────────────────────────────── */
    .section-label {
      font-size: .8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--muted);
      margin: 18px 0 8px;
    }

    .req-list { margin-top: 4px; }

    .req-item {
      background: var(--surface);
      border-radius: 10px;
      margin-bottom: 9px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
    }
    .req-header {
      display: flex;
      align-items: center;
      padding: 13px 14px;
      cursor: pointer;
      gap: 12px;
      user-select: none;
    }
    .req-header:active { background: var(--bg); }

    .req-bubble {
      min-width: 46px; height: 46px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 1.05rem;
      flex-shrink: 0;
    }
    .bubble-high   { background: var(--red);   color: #fff; }
    .bubble-med    { background: var(--amber);  color: #fff; }
    .bubble-low    { background: var(--amber-light); color: #92400e; }

    .req-info { flex: 1; min-width: 0; }
    .req-name { font-weight: 700; font-size: .92rem; }
    .req-sub  { font-size: .78rem; color: var(--muted); margin-top: 2px; }

    .req-chevron {
      font-size: 1.1rem;
      color: var(--border);
      transition: transform .2s;
      flex-shrink: 0;
    }
    .req-item.open .req-chevron { transform: rotate(90deg); }

    .req-scouts {
      padding: 0 14px 13px 72px;
      display: none;
    }
    .req-item.open .req-scouts { display: block; }
    .req-scouts .tag {
      display: inline-block;
      background: var(--bg);
      border-radius: 100px;
      padding: 3px 10px;
      margin: 3px 3px 3px 0;
      font-size: .8rem;
    }

    /* ── Upload ──────────────────────────────────────────────────────── */
    .upload-toggle {
      display: block;
      width: 100%;
      background: none;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 10px 16px;
      font-size: .85rem;
      color: var(--muted);
      cursor: pointer;
      text-align: left;
      margin-top: 20px;
      margin-bottom: 8px;
      font-weight: 600;
      transition: border-color .2s, color .2s;
    }
    .upload-toggle:hover { border-color: var(--navy); color: var(--navy); }

    .upload-zone {
      border: 2px dashed var(--border);
      border-radius: 10px;
      padding: 28px 16px;
      text-align: center;
      cursor: pointer;
      transition: border-color .2s, background .2s;
      display: none;
      margin-bottom: 20px;
    }
    .upload-zone.visible { display: block; }
    .upload-zone:hover, .upload-zone.over {
      border-color: var(--navy);
      background: #f0f4ff;
    }
    .upload-zone .icon { font-size: 2rem; margin-bottom: 6px; }
    .upload-zone .label { font-weight: 600; }
    .upload-zone .hint { font-size: .82rem; color: var(--muted); margin-top: 4px; }
    #fileInput { display: none; }

    /* ── Loading ─────────────────────────────────────────────────────── */
    .loading { text-align: center; padding: 32px; color: var(--muted); }
    .spinner {
      width: 28px; height: 28px;
      border: 3px solid var(--border);
      border-top-color: var(--navy);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin: 0 auto 10px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<!-- ═══════════════════════ HEADER ═══════════════════════ -->
<header>
  <h1>Requirements Identifier</h1>
</header>

<!-- ═══════════════════════ CONTENT ═══════════════════════ -->
<div id="mainContent">

  <div id="loadingState" class="loading"><div class="spinner"></div>Loading report…</div>

  <div id="appBody" style="display:none">

    <div class="content">

      <div id="mainAlert"></div>

      <div class="card">
        <div class="card-title">Present Tonight</div>
        <div class="present-chips" id="presentChips"></div>
      </div>

      <div class="section-label">Requirements — ranked by need</div>
      <div id="reqList" class="req-list"></div>

      <!-- Upload -->
      <button class="upload-toggle" onclick="toggleUpload()">⬆ Upload new report CSV</button>
      <div class="upload-zone" id="uploadZone">
        <div class="icon">📄</div>
        <div class="label">Tap to choose CSV</div>
        <div class="hint">Download from ScoutBook, then select it here</div>
      </div>
      <input type="file" id="fileInput" accept=".csv">

    </div>
  </div>

</div>

<!-- ═══════════════════════ SCRIPT ═══════════════════════ -->
<script>
"use strict";

let reportData    = null;
let presentScouts = new Set();

// ── Init ──────────────────────────────────────────────────────────────────────

async function init() {
  try {
    const res = await fetch("/api/report");
    if (!res.ok) throw new Error((await res.json()).detail);
    reportData = await res.json();

    // Default: all scouts present
    reportData.scouts.forEach(s => presentScouts.add(s));

    document.getElementById("loadingState").style.display = "none";
    document.getElementById("appBody").style.display      = "block";
    render();
  } catch (e) {
    document.getElementById("loadingState").innerHTML =
      `<div style="color:var(--red);font-size:.9rem;padding:32px">⚠ ${escHtml(e.message)}</div>`;
  }
  wireUpload();
}

// ── Render ────────────────────────────────────────────────────────────────────

function render() {
  const present = Array.from(presentScouts);

  // Score each requirement by how many present scouts still need it
  const scored = reportData.requirements
    .map(req => {
      const needed = present.filter(s => !req.completed[s]);
      return { name: req.name, count: needed.length, total: present.length, scouts: needed };
    })
    .filter(r => r.count > 0)
    .sort((a, b) => b.count - a.count || a.name.localeCompare(b.name));

  // All scouts as toggleable chips — green = present, red = absent
  document.getElementById("presentChips").innerHTML = reportData.scouts
    .map(s => `<span class="chip${presentScouts.has(s) ? '' : ' absent'}" data-scout="${escHtml(s)}">${escHtml(s)}</span>`)
    .join("");
  document.querySelectorAll("#presentChips .chip").forEach(chip =>
    chip.addEventListener("click", () => toggleScout(chip.dataset.scout))
  );

  // Requirements list
  const list = document.getElementById("reqList");
  if (!scored.length) {
    list.innerHTML = `<div class="card" style="text-align:center;color:var(--green);font-weight:700;padding:24px">
      🎉 Everyone present has completed all requirements!
    </div>`;
    return;
  }

  list.innerHTML = scored.map(r => {
    const pct    = r.count / r.total;
    const bubble = pct >= 0.6 ? "bubble-high" : pct >= 0.35 ? "bubble-med" : "bubble-low";
    const tags   = r.scouts.map(s => `<span class="tag">${escHtml(s)}</span>`).join("");
    return `
      <div class="req-item" onclick="toggleReq(this)">
        <div class="req-header">
          <div class="req-bubble ${bubble}">${r.count}</div>
          <div class="req-info">
            <div class="req-name">${escHtml(r.name)}</div>
            <div class="req-sub">${r.count} of ${r.total} present scouts still need this</div>
          </div>
          <span class="req-chevron">›</span>
        </div>
        <div class="req-scouts"><strong>Needs:</strong> ${tags}</div>
      </div>`;
  }).join("");
}

function toggleScout(name) {
  if (presentScouts.has(name)) {
    presentScouts.delete(name);
  } else {
    presentScouts.add(name);
  }
  render();
}

function toggleReq(item) {
  item.classList.toggle("open");
}

// ── Upload ────────────────────────────────────────────────────────────────────

function toggleUpload() {
  document.getElementById("uploadZone").classList.toggle("visible");
}

function wireUpload() {
  const zone  = document.getElementById("uploadZone");
  const input = document.getElementById("fileInput");

  zone.addEventListener("click",     () => input.click());
  input.addEventListener("change",   e  => handleFile(e.target.files[0]));
  zone.addEventListener("dragover",  e  => { e.preventDefault(); zone.classList.add("over"); });
  zone.addEventListener("dragleave", ()  => zone.classList.remove("over"));
  zone.addEventListener("drop", e => {
    e.preventDefault();
    zone.classList.remove("over");
    if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
  });
}

async function handleFile(file) {
  if (!file?.name.toLowerCase().endsWith(".csv")) {
    showAlert("mainAlert", "err", "Please select a .csv file.");
    return;
  }
  showAlert("mainAlert", "inf", "Uploading…");
  const form = new FormData();
  form.append("file", file);
  try {
    const res  = await fetch("/api/upload", { method: "POST", body: form });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "Upload failed");

    document.getElementById("fileInput").value = "";
    document.getElementById("uploadZone").classList.remove("visible");

    const rRes = await fetch("/api/report");
    reportData    = await rRes.json();
    presentScouts = new Set(reportData.scouts);
    render();
    showAlert("mainAlert", "ok", `✓ Uploaded <strong>${escHtml(file.name)}</strong> — ${data.scouts} scouts loaded.`);
  } catch (e) {
    showAlert("mainAlert", "err", `✗ ${escHtml(e.message)}`);
  }
}

// ── Utilities ─────────────────────────────────────────────────────────────────

function showAlert(targetId, type, html) {
  const el  = document.getElementById(targetId);
  const cls = { ok: "alert-ok", err: "alert-err", inf: "alert-inf" }[type];
  el.innerHTML = `<div class="alert ${cls}">${html}</div>`;
}

function escHtml(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

// ── Boot ──────────────────────────────────────────────────────────────────────
init();
</script>
</body>
</html>
