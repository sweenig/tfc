services:
  tailscale:
    image: tailscale/tailscale:latest
    hostname: tfc-planner
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
    volumes:
      - tailscale-state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    restart: unless-stopped

  tfc-app:
    build:
      context: ./app
      dockerfile: ../Dockerfile
    # LIVE mode (default): app is only reachable through Tailscale.
    # network_mode: "service:tailscale"
    # depends_on:
    #   - tailscale
    # DEV mode (localhost):
    # 1) Comment out the `network_mode` and `depends_on` lines above.
    # 2) Uncomment the `ports` block below.
    ports:
      - "8082:8080"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

volumes:
  tailscale-state:
